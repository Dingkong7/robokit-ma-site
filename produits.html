<script>
  let activeCategory = getQueryParam("cat") || "all";
  let activeSub = getQueryParam("sub") || "all";

  function renderChips(){
    const chips = [{id:"all", label:"Tous"}, ...CATEGORIES.map(c => ({id:c.id, label:c.label}))];
    const el = document.getElementById("chipFilters");
    el.innerHTML = chips.map(c =>
      `<button class="chip-filter ${activeCategory===c.id?'active':''}" data-chip="${c.id}">${c.label}</button>`
    ).join("");
    renderSubChips();
    el.querySelectorAll("[data-chip]").forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.getAttribute("data-chip");
        activeSub = "all";
        renderChips();
        applyFilters();
      });
    });
  }

  function renderSubChips(){
    const el = document.getElementById("subChipFilters");
    const cat = CATEGORIES.find(c => c.id === activeCategory);
    if(!cat || !cat.subs.length){ el.innerHTML = ""; el.style.display = "none"; return; }
    el.style.display = "";
    const chips = [{id:"all", label:"Toutes"}, ...cat.subs];
    el.innerHTML = chips.map(c =>
      `<button class="chip-filter chip-sub ${activeSub===c.id?'active':''}" data-sub="${c.id}">${c.label}</button>`
    ).join("");
    el.querySelectorAll("[data-sub]").forEach(btn => {
      btn.addEventListener("click", () => {
        activeSub = btn.getAttribute("data-sub");
        renderSubChips();
        applyFilters();
      });
    });
  }

  async function applyFilters(){
    const query = document.getElementById("searchInput").value.trim().toLowerCase();
    const sort = document.getElementById("sortSelect").value;
    let list = await getAllProducts();

    if(activeCategory !== "all"){
      list = list.filter(p => p.category === activeCategory);
      if(activeSub !== "all") list = list.filter(p => p.subcategory === activeSub);
    }
    if(query){
      list = list.filter(p =>
        p.title.toLowerCase().includes(query) ||
        p.description.toLowerCase().includes(query) ||
        categoryLabel(p.category).toLowerCase().includes(query) ||
        subcategoryLabel(p.category, p.subcategory).toLowerCase().includes(query)
      );
    }
    if(sort === "price-asc") list = [...list].sort((a,b) => a.price - b.price);
    if(sort === "price-desc") list = [...list].sort((a,b) => b.price - a.price);
    if(sort === "name-asc") list = [...list].sort((a,b) => a.title.localeCompare(b.title));

    renderProductGrid("productGrid", list);
  }

  document.addEventListener("DOMContentLoaded", () => {
    if(warnIfNotConfigured("#productGrid")) return;
    renderChips();
    applyFilters();
    document.getElementById("searchInput").addEventListener("input", applyFilters);
    document.getElementById("sortSelect").addEventListener("change", applyFilters);
  });
</script>
