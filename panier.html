<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier — RoboKit.ma</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="panier">

<header class="site-header" id="site-header"></header>

<main>
  <div class="wrap page-head">
    <div class="breadcrumb"><a href="index.html">Accueil</a> / Panier</div>
    <h1>Votre panier</h1>
  </div>

  <section class="wrap" id="cartSection">
    <!-- rempli en JS -->
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/data/products-index.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/components.js"></script>
<script>
  async function renderCartPage(){
    if(warnIfNotConfigured("#cartSection")) return;
    const section = document.getElementById("cartSection");
    const items = await cartDetails();

    if(items.length === 0){
      section.innerHTML = `
        <div class="empty-state">
          <p>Votre panier est vide pour le moment.</p>
          <a href="produits.html" class="btn btn-copper" style="margin-top:14px;">Parcourir les produits</a>
        </div>`;
      return;
    }

    const rows = items.map(l => `
      <div class="cart-row" data-row="${l.id}">
        <div class="thumb">${categoryIcon(l.product.category,"")}</div>
        <div>
          <h4>${l.product.title}</h4>
          <span class="cat-lbl">${categoryLabel(l.product.category)} · ${formatPrice(l.product.price)}</span>
        </div>
        <div class="qty-control">
          <button onclick="changeQty('${l.id}', ${l.qty - 1})" aria-label="Diminuer">−</button>
          <span>${l.qty}</span>
          <button onclick="changeQty('${l.id}', ${l.qty + 1})" aria-label="Augmenter">+</button>
        </div>
        <span class="line-total">${formatPrice(l.subtotal)}</span>
        <button class="remove-btn" onclick="removeLine('${l.id}')">Supprimer</button>
      </div>
    `).join("");

    const total = await cartTotal();

    section.innerHTML = `
      <div class="cart-layout">
        <div class="panel">
          ${rows}
          <div style="margin-top:16px;">
            <button class="btn btn-ghost btn-sm" onclick="clearCartAndRefresh()">Vider le panier</button>
          </div>
        </div>
        <div class="summary-box">
          <h3 style="font-size:1.1rem;">Résumé de la commande</h3>
          <div class="summary-row"><span>Articles</span><span>${cartItemCount()}</span></div>
          <div class="summary-row"><span>Livraison</span><span>À convenir</span></div>
          <div class="summary-row total"><span>Total</span><span class="price">${formatPrice(total)}</span></div>
          <a href="commander.html" class="btn btn-copper btn-block" style="margin-top:16px;">Passer la commande</a>
          <a href="produits.html" class="btn btn-outline btn-block" style="margin-top:10px;">Continuer mes achats</a>
        </div>
      </div>
    `;
  }

  function changeQty(id, qty){
    updateQty(id, qty);
    renderCartPage();
  }
  function removeLine(id){
    removeFromCart(id);
    renderCartPage();
  }
  function clearCartAndRefresh(){
    clearCart();
    renderCartPage();
  }

  document.addEventListener("DOMContentLoaded", renderCartPage);
</script>
</body>
</html>
