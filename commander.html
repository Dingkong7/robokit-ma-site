<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commander — RoboKit.ma</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/images/favicon-192.png">
<link rel="shortcut icon" href="assets/images/favicon.ico">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="commander">

<header class="site-header" id="site-header"></header>

<main>
  <div class="wrap page-head">
    <div class="breadcrumb"><a href="index.html">Accueil</a> / <a href="panier.html">Panier</a> / Commander</div>
    <h1>Finaliser la commande</h1>
    <p style="color:var(--silk-dim);max-width:60ch;">Aucun paiement en ligne : vous confirmez vos coordonnées, puis votre commande est envoyée directement à notre équipe sur WhatsApp.</p>
  </div>

  <section class="wrap" id="checkoutSection"></section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/data/products-index.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/components.js"></script>
<script>
  // Numéros WhatsApp (format international, sans "+" ni espaces)
  const WHATSAPP_NUMBERS = [
    "212649408826",   // vous
    "212713472979"    // <-- remplacez par le numéro de votre partenaire
  ];

  async function renderCheckout(){
    if(warnIfNotConfigured("#checkoutSection")) return;
    const section = document.getElementById("checkoutSection");
    const items = await cartDetails();

    if(items.length === 0){
      section.innerHTML = `
        <div class="empty-state">
          <p>Votre panier est vide. Ajoutez des produits avant de commander.</p>
          <a href="produits.html" class="btn btn-copper" style="margin-top:14px;">Parcourir les produits</a>
        </div>`;
      return;
    }

    const lines = items.map(l => `<div class="mini-line"><span>${l.qty} × ${l.product.title}</span><span>${formatPrice(l.subtotal)}</span></div>`).join("");
    const total = await cartTotal();

    section.innerHTML = `
      <div class="checkout-layout">
        <form id="checkoutForm" class="panel" novalidate>
          <h3 style="margin-top:0;">Vos coordonnées</h3>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px;">
            <div class="field" id="fieldFirstName">
              <label for="custFirstName">Prénom *</label>
              <input type="text" id="custFirstName" name="custFirstName" placeholder="ex : Youssef" required>
              <span class="err">Veuillez indiquer votre prénom.</span>
            </div>

            <div class="field" id="fieldLastName">
              <label for="custLastName">Nom *</label>
              <input type="text" id="custLastName" name="custLastName" placeholder="ex : El Amrani" required>
              <span class="err">Veuillez indiquer votre nom.</span>
            </div>
          </div>

          <div class="field" id="fieldPhone">
            <label for="custPhone">Numéro de téléphone *</label>
            <input type="tel" id="custPhone" name="custPhone" placeholder="ex : 06 00 00 00 00" required>
            <span class="hint">Utilisé uniquement pour confirmer votre commande.</span>
            <span class="err">Veuillez indiquer un numéro de téléphone valide.</span>
          </div>

          <div class="field" id="fieldEmail">
            <label for="custEmail">Adresse email (optionnel)</label>
            <input type="email" id="custEmail" name="custEmail" placeholder="ex : youssef@gmail.com">
            <span class="hint">Pour recevoir votre confirmation et le suivi de commande.</span>
            <span class="err">Veuillez indiquer un email valide.</span>
          </div>

          <div class="field" id="fieldCity">
            <label for="custCity">Ville *</label>
            <input type="text" id="custCity" name="custCity" placeholder="ex : Casablanca" required>
            <span class="err">Veuillez indiquer votre ville.</span>
          </div>

          <div class="field" id="fieldAddress">
            <label for="custAddress">Adresse *</label>
            <input type="text" id="custAddress" name="custAddress" placeholder="ex : Quartier, rue, n° d'immeuble..." required>
            <span class="err">Veuillez indiquer votre adresse.</span>
          </div>

          <label style="display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--silk-dim);margin:-6px 0 18px;cursor:pointer;">
            <input type="checkbox" id="sameAsDelivery" checked style="width:16px;height:16px;accent-color:var(--copper-bright);">
            Livrer à la même adresse
          </label>

          <div class="field hidden" id="fieldDeliveryAddress">
            <label for="custDeliveryAddress">Adresse de livraison *</label>
            <input type="text" id="custDeliveryAddress" name="custDeliveryAddress" placeholder="Adresse de livraison si différente">
            <span class="err">Veuillez indiquer l'adresse de livraison.</span>
          </div>

          <div class="field">
            <label for="custNote">Message / note (optionnel)</label>
            <textarea id="custNote" name="custNote" rows="4" placeholder="Précisions sur la livraison, horaires, etc."></textarea>
          </div>

          <button type="submit" class="btn btn-copper btn-block">Confirmer et envoyer sur WhatsApp</button>
          <p class="hint" style="text-align:center;margin-top:12px;">Vous serez redirigé vers WhatsApp avec votre commande pré-remplie.</p>
        </form>

        <div class="summary-box">
          <h3 style="font-size:1.1rem;">Récapitulatif</h3>
          ${lines}
          <div class="summary-row total"><span>Total</span><span class="price">${formatPrice(total)}</span></div>
        </div>
      </div>
    `;

    document.getElementById("checkoutForm").addEventListener("submit", handleCheckoutSubmit);

    const sameAsDelivery = document.getElementById("sameAsDelivery");
    const fieldDeliveryAddress = document.getElementById("fieldDeliveryAddress");
    const custDeliveryAddress = document.getElementById("custDeliveryAddress");
    sameAsDelivery.addEventListener("change", () => {
      const same = sameAsDelivery.checked;
      fieldDeliveryAddress.classList.toggle("hidden", same);
      custDeliveryAddress.required = !same;
      if(same) custDeliveryAddress.value = "";
    });
  }

  async function handleCheckoutSubmit(e){
    e.preventDefault();

    const firstName = document.getElementById("custFirstName").value.trim();
    const lastName  = document.getElementById("custLastName").value.trim();
    const phone     = document.getElementById("custPhone").value.trim();
    const email     = document.getElementById("custEmail").value.trim();
    const city      = document.getElementById("custCity").value.trim();
    const address   = document.getElementById("custAddress").value.trim();
    const sameAsDelivery = document.getElementById("sameAsDelivery").checked;
    const deliveryAddress = sameAsDelivery
      ? address
      : document.getElementById("custDeliveryAddress").value.trim();
    const note      = document.getElementById("custNote").value.trim();

    const fields = {
      fieldFirstName: firstName.length >= 2,
      fieldLastName:  lastName.length >= 2,
      fieldPhone:     phone.replace(/[^0-9+]/g, "").length >= 9,
      fieldCity:      city.length >= 2,
      fieldAddress:   address.length >= 4,
      fieldDeliveryAddress: sameAsDelivery || deliveryAddress.length >= 4,
      fieldEmail:     email === "" || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email),
    };

    let valid = true;
    Object.entries(fields).forEach(([id, ok]) => {
      const el = document.getElementById(id);
      if(!el) return;
      el.classList.toggle("invalid", !ok);
      if(!ok) valid = false;
    });
    if(!valid) return;

    const items = await cartDetails();
    const total = await cartTotal();

    let message = `Nouvelle commande —  robokit.netlify.app/%0A%0A`;
    message += `*Client :* ${firstName} ${lastName}%0A`;
    message += `*Téléphone :* ${phone}%0A`;
    if(email){ message += `*Email :* ${email}%0A`; }
    message += `*Ville :* ${city}%0A`;
    message += `*Adresse :* ${address}%0A`;
    if(!sameAsDelivery){ message += `*Adresse de livraison :* ${deliveryAddress}%0A`; }
    message += `%0A*Produits commandés :*%0A`;
    items.forEach(l => {
      message += `- ${l.qty} × ${l.product.title} — ${formatPrice(l.subtotal)}%0A`;
    });
    message += `%0A*Total : ${formatPrice(total)}*%0A`;
    if(note){ message += `%0A*Note :* ${note}%0A`; }

    clearCart();

    // Ouvre un onglet WhatsApp par numéro configuré.
    // Le premier numéro redirige la page actuelle (comportement inchangé pour le client),
    // les numéros suivants s'ouvrent dans de nouveaux onglets.
    WHATSAPP_NUMBERS.forEach((number, index) => {
      const url = `https://wa.me/${number}?text=${message}`;
      if(index === 0){
        window.location.href = url;
      } else {
        window.open(url, "_blank");
      }
    });
  }

  document.addEventListener("DOMContentLoaded", renderCheckout);
</script>
</body>
</html>
